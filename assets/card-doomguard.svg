<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="DoomGuard">
  <defs>
    <clipPath id="r"><rect width="520" height="190" rx="12"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="520" height="190" fill="#131614"/>
    <rect width="520" height="190" fill="url(#glow)"/>
    <rect width="4" height="190" fill="#4ade80"/>

    <text x="28" y="38" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#4ade80" letter-spacing="1.8">ANDROID · NATIVE</text>
    <text x="28" y="76" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#f2f5f2" letter-spacing="-0.5">DoomGuard</text>
    <text x="28" y="104" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c6cdc7">Blocks distracting apps until the day&#x27;s</text>
    <text x="28" y="124" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c6cdc7">habits are actually done.</text>
    <text x="28.0" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#4ade80">78</text>
    <text x="47.8" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#828a83">tests</text>
    <text x="100.3" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#4ade80">CI</text>
    <text x="120.1" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#828a83">on every push</text>
    <text x="227.8" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#4ade80">1 Hz</text>
    <text x="261.4" y="150" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#828a83">foreground svc</text>

    <text x="494" y="40" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#828a83" text-anchor="end">&#8599;</text>
    <text x="494" y="174" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#828a83" text-anchor="end">React Native · TypeScript · Kotlin</text>

    <rect x="0.75" y="0.75" width="518.5" height="188.5" rx="12" fill="none" stroke="#262b28" stroke-width="1.5"/>
  </g>
</svg>
