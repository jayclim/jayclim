<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jayden Lim. CS at Cornell. Computer vision, agents, and the dashboards that make them legible.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e100f"/>
      <stop offset="60%" stop-color="#0b0d0c"/>
      <stop offset="100%" stop-color="#101413"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fd4c4"/>
      <stop offset="55%" stop-color="#8ae86a"/>
      <stop offset="100%" stop-color="#cdfa50"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cdfa50"/>
      <stop offset="100%" stop-color="#cdfa50" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- court, drawn in perspective on the right -->
    <g stroke="#2a302c" stroke-width="1.5" fill="none">
      <path d="M700 280 L1010 280 L1128 92 L906 92 Z"/>
      <path d="M855 280 L1017 92" stroke="#212623"/>
      <path d="M751 187 L1069 187" stroke="#212623"/>
      <path d="M726 233 L1040 233" stroke="#1e2320"/>
      <path d="M829 140 L1099 140" stroke="#1e2320"/>
    </g>
    <!-- net -->
    <path d="M751 187 L1069 187" stroke="#39413c" stroke-width="2.5" fill="none"/>

    <!-- tracked shuttle trajectory -->
    <path d="M620 260 Q 850 40 1150 150" stroke="url(#arc)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.95"/>
    <g fill="#0b0d0c" stroke="url(#arc)" stroke-width="2">
      <circle cx="620" cy="260" r="4"/>
      <circle cx="691" cy="201" r="4"/>
      <circle cx="764" cy="158" r="4"/>
      <circle cx="841" cy="129" r="4"/>
      <circle cx="921" cy="115" r="4"/>
      <circle cx="1004" cy="116" r="4"/>
      <circle cx="1091" cy="131" r="4"/>
    </g>
    <circle cx="1150" cy="150" r="6.5" fill="#cdfa50"/>
    <circle cx="1150" cy="150" r="13" fill="none" stroke="#cdfa50" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- tracked players -->
    <circle cx="905" cy="243" r="7" fill="#ff8b5e"/>
    <circle cx="905" cy="243" r="14" fill="none" stroke="#ff8b5e" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="1010" cy="140" r="6" fill="#2fd4c4"/>
    <circle cx="1010" cy="140" r="12" fill="none" stroke="#2fd4c4" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- wordmark -->
    <text x="72" y="132" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#f2f5f2" letter-spacing="-1.5">JAYDEN<tspan fill="#cdfa50"> LIM</tspan></text>
    <rect x="74" y="152" width="300" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="74" y="188" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#8b938c" letter-spacing="2.2">CS @ CORNELL · GRADUATING MAY 2028</text>

    <text x="72" y="228" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#c6cdc7">I build computer vision and agent systems,</text>
    <text x="72" y="256" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#c6cdc7">then the dashboards that make them legible.</text>

    <rect x="0" y="0" width="1200" height="300" rx="16" fill="none" stroke="#262b28" stroke-width="2"/>
  </g>
</svg>
